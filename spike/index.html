<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seesaw</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <div class="left-group">
    <button id="prevBtn" title="Previous puzzle">&#9664;</button>
    <span id="counter">Puzzle 1 of 5</span>
    <button id="nextBtn" title="Next puzzle">&#9654;</button>
    <span id="title" class="puzzle-title">Both sides must weigh the same</span>
  </div>
  <div class="right-group">
    <button id="hintBtn">Hint</button>
    <button id="undoBtn">Undo</button>
    <button id="resetBtn">Reset</button>
  </div>
</header>

<nav id="levelStrip" class="level-strip">
  <!-- filled by app.js -->
</nav>

<div id="hint" class="hidden"></div>

<main>
<div id="play">
  <svg id="board" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
    <!-- ground and fulcrum -->
    <line x1="80" y1="400" x2="820" y2="400" class="ground"></line>
    <polygon points="450,282 398,400 502,400" class="fulcrum"></polygon>

    <!-- everything that tilts lives in this group -->
    <g id="beamGroup">
      <rect x="150" y="272" width="600" height="16" rx="8" class="beam"></rect>
      <circle cx="450" cy="280" r="9" class="pivot"></circle>

      <g id="pan-left" class="pan" data-side="left">
        <rect class="dropzone" x="20" y="40" width="340" height="200" data-side="left"></rect>
        <line x1="190" y1="272" x2="190" y2="238" class="post"></line>
        <rect x="30" y="226" width="320" height="12" rx="6" class="pan-plate" data-side="left"></rect>
        <g class="pieces"></g>
      </g>

      <g id="pan-right" class="pan" data-side="right">
        <rect class="dropzone" x="540" y="40" width="340" height="200" data-side="right"></rect>
        <line x1="710" y1="272" x2="710" y2="238" class="post"></line>
        <rect x="550" y="226" width="320" height="12" rx="6" class="pan-plate" data-side="right"></rect>
        <g class="pieces"></g>
      </g>
    </g>
  </svg>

  <div id="status" class="status"></div>
  <div id="notation" class="notation">0 = 0</div>

  <!-- level 4 only: machines that act on both sides at once -->
  <div id="machines" class="machines hidden">
    <span class="label">Machines:</span>
    <button id="clone2Btn" class="machine" data-machine="clone" data-n="2">Clone &times;2</button>
    <button id="clone3Btn" class="machine" data-machine="clone" data-n="3">Clone &times;3</button>
    <button id="share2Btn" class="machine" data-machine="share" data-n="2">Share by 2</button>
    <button id="share3Btn" class="machine" data-machine="share" data-n="3">Share by 3</button>
    <span id="machineMsg" class="machine-msg"></span>
  </div>

  <div id="levelDone" class="level-done hidden">
    <span id="levelDoneText">Level done!</span>
    <button id="levelDoneNextBtn" class="accent">Next &#9654;</button>
  </div>

  <div id="dial" class="dial hidden">
    <label for="dialRange">What if the box weighed&hellip; <strong id="dialValue">4</strong></label>
    <input id="dialRange" type="range" min="0" max="12" step="1" value="4">
    <button id="dialNextBtn" class="accent">Next puzzle &#9654;</button>
  </div>
</div>

<aside id="farm" class="farm">
  <div class="farm-head">
    <div>
      <div class="farm-title">Your farm</div>
      <div id="farmCount" class="farm-count">0 animals</div>
    </div>
    <button id="farmResetBtn" class="linkish" title="Send every animal away and start again">Reset farm</button>
  </div>
  <div id="farmGround" class="farm-ground">
    <!-- animals filled by app.js -->
  </div>
  <div class="farm-legend">&#9733; rare</div>
</aside>
</main>

<footer>
  <div id="palette" class="palette">
    <span class="label">Weights:</span>
    <!-- filled by app.js -->
  </div>
</footer>

<script src="puzzles.js"></script>
<script src="app.js"></script>
</body>
</html>
