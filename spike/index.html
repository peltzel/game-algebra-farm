<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seesaw</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <div class="left-group">
    <button id="prevBtn" title="Previous puzzle">&#9664;</button>
    <span id="counter">Puzzle 1 of 5</span>
    <button id="nextBtn" title="Next puzzle">&#9654;</button>
    <span id="title" class="puzzle-title">Both sides must weigh the same</span>
  </div>
  <div class="right-group">
    <button id="hintBtn">Hint</button>
    <button id="undoBtn">Undo</button>
    <button id="resetBtn">Reset</button>
    <button id="farmShowBtn" class="small hidden" title="Bring the farm column back">Show farm (0)</button>
  </div>
</header>

<nav id="levelStrip" class="level-strip">
  <!-- filled by app.js -->
</nav>

<div id="hint" class="hidden"></div>

<main>
<div id="play">
  <svg id="board" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
    <!-- ground and fulcrum -->
    <line x1="80" y1="400" x2="820" y2="400" class="ground"></line>
    <polygon points="450,282 398,400 502,400" class="fulcrum"></polygon>

    <!-- everything that tilts lives in this group -->
    <g id="beamGroup">
      <rect x="150" y="272" width="600" height="16" rx="8" class="beam"></rect>
      <circle cx="450" cy="280" r="9" class="pivot"></circle>

      <g id="pan-left" class="pan" data-side="left">
        <rect class="dropzone" x="20" y="40" width="340" height="200" data-side="left"></rect>
        <line x1="190" y1="272" x2="190" y2="238" class="post"></line>
        <rect x="30" y="226" width="320" height="12" rx="6" class="pan-plate" data-side="left"></rect>
        <g class="trays"></g>
        <g class="pieces"></g>
        <g class="anim"></g>
      </g>

      <g id="pan-right" class="pan" data-side="right">
        <rect class="dropzone" x="540" y="40" width="340" height="200" data-side="right"></rect>
        <line x1="710" y1="272" x2="710" y2="238" class="post"></line>
        <rect x="550" y="226" width="320" height="12" rx="6" class="pan-plate" data-side="right"></rect>
        <g class="trays"></g>
        <g class="pieces"></g>
        <g class="anim"></g>
      </g>
    </g>

    <!-- clone machine: a copier bar that slides in above both pans (parked off-screen until used) -->
    <g id="gantry" class="gantry">
      <rect class="bar" x="40" y="4" width="820" height="16" rx="8"></rect>
      <circle class="lamp" cx="190" cy="12" r="6"></circle>
      <circle class="lamp" cx="450" cy="12" r="6"></circle>
      <circle class="lamp" cx="710" cy="12" r="6"></circle>
    </g>
  </svg>

  <div id="status" class="status"></div>
  <div id="notation" class="notation">0 = 0</div>

  <!-- level 4 only: machines that act on both sides at once -->
  <div id="machines" class="machines hidden">
    <span class="label">Machines:</span>
    <button id="clone2Btn" class="machine" data-machine="clone" data-n="2">
      <svg class="glyph" viewBox="0 0 56 20" aria-hidden="true"><rect x="2" y="4" width="12" height="12" rx="2"/><path d="M17 10h7m-3-3 3 3-3 3"/><rect x="27" y="4" width="12" height="12" rx="2"/><rect x="42" y="4" width="12" height="12" rx="2"/></svg>
      <span>Clone &times;2</span>
    </button>
    <button id="clone3Btn" class="machine" data-machine="clone" data-n="3">
      <svg class="glyph" viewBox="0 0 71 20" aria-hidden="true"><rect x="2" y="4" width="12" height="12" rx="2"/><path d="M17 10h7m-3-3 3 3-3 3"/><rect x="27" y="4" width="12" height="12" rx="2"/><rect x="42" y="4" width="12" height="12" rx="2"/><rect x="57" y="4" width="12" height="12" rx="2"/></svg>
      <span>Clone &times;3</span>
    </button>
    <button id="share2Btn" class="machine" data-machine="share" data-n="2">
      <svg class="glyph" viewBox="0 0 40 22" aria-hidden="true"><rect x="7" y="1" width="6" height="6" rx="1"/><rect x="17" y="1" width="6" height="6" rx="1"/><rect x="27" y="1" width="6" height="6" rx="1"/><path d="M3 12v8h14v-8"/><path d="M23 12v8h14v-8"/></svg>
      <span>Share by 2</span>
    </button>
    <button id="share3Btn" class="machine" data-machine="share" data-n="3">
      <svg class="glyph" viewBox="0 0 40 22" aria-hidden="true"><rect x="7" y="1" width="6" height="6" rx="1"/><rect x="17" y="1" width="6" height="6" rx="1"/><rect x="27" y="1" width="6" height="6" rx="1"/><path d="M1 12v8h10v-8"/><path d="M15 12v8h10v-8"/><path d="M29 12v8h10v-8"/></svg>
      <span>Share by 3</span>
    </button>
    <span id="machineMsg" class="machine-msg"></span>
  </div>

  <div id="levelDone" class="level-done hidden">
    <span id="levelDoneText">Level done!</span>
    <button id="levelDoneNextBtn" class="accent">Next &#9654;</button>
  </div>

  <div id="dial" class="dial hidden">
    <label for="dialRange">What if the box weighed&hellip; <strong id="dialValue">4</strong></label>
    <input id="dialRange" type="range" min="0" max="12" step="1" value="4">
    <button id="dialNextBtn" class="accent">Next puzzle &#9654;</button>
    <button id="dialUndoBtn" class="hidden" title="Undo the last move">Undo</button>
  </div>
</div>

<aside id="farm" class="farm">
  <div class="farm-head">
    <div>
      <div class="farm-title">Your farm</div>
      <div class="farm-count-row">
        <span id="farmCount" class="farm-count">0 animals</span>
        <button id="farmHideBtn" class="small" title="Tuck the farm away so the seesaw gets the whole width">Hide farm</button>
      </div>
    </div>
    <button id="farmResetBtn" class="linkish" title="Send every animal away and start again">Reset farm</button>
  </div>
  <div id="farmGround" class="farm-ground">
    <!-- animals filled by app.js -->
  </div>
  <div class="farm-legend">&#9733; rare</div>
</aside>
</main>

<footer>
  <div id="palette" class="palette">
    <span class="label">Weights:</span>
    <!-- filled by app.js -->
  </div>
</footer>

<script src="puzzles.js"></script>
<script src="app.js"></script>
</body>
</html>
